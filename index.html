<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Valentine Proposal ❤️</title>
<style>
    body {
        margin: 0;
        height: 100vh;
        background: linear-gradient(135deg, #ff4e50, #f9d423);
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: 'Poppins', sans-serif;
        overflow: hidden;
    }

    .card {
        background: white;
        padding: 40px;
        border-radius: 20px;
        text-align: center;
        width: 320px;
        box-shadow: 0 20px 40px rgba(0,0,0,0.2);
    }

    h1 {
        color: #ff4e50;
        font-size: 24px;
    }

    .buttons {
        margin-top: 30px;
        position: relative;
        height: 120px;
    }

    button {
        padding: 12px 30px;
        border: none;
        border-radius: 30px;
        font-size: 16px;
        cursor: pointer;
        position: absolute;
        transition: 0.3s ease;
    }

    #yes {
        background: #ff4e50;
        color: white;
        left: 50%;
        transform: translateX(-50%);
    }

    #no {
        background: #ccc;
        color: black;
        left: 20%;
        top: 60px;
    }

    .celebrate {
        display: none;
        flex-direction: column;
        align-items: center;
        animation: fadeIn 1s ease;
    }

    .celebrate img {
        width: 220px;
        margin-top: 20px;
    }

    @keyframes fadeIn {
        from {opacity: 0;}
        to {opacity: 1;}
    }
</style>
</head>

<body>

<div class="card" id="proposal">
    <h1>Anuradha 💖<br>Will you be my Valentine?</h1>

    <div class="buttons">
        <button id="yes" onclick="yesClicked()">YES ❤️</button>
        <button id="no" onmouseover="moveNo()">NO 🙈</button>
    </div>
</div>

<div class="card celebrate" id="celebrate">
    <h1>She said YES! 🎉💑</h1>
    <p>Best Valentine Ever 💖</p>
    <img src="https://media.giphy.com/media/MDJ9IbxxvDUQM/giphy.gif">
</div>

<script>
function moveNo() {
    const noBtn = document.getElementById("no");
    const x = Math.random() * 200 - 100;
    const y = Math.random() * 80 - 40;
    noBtn.style.transform = `translate(${x}px, ${y}px)`;
}

function yesClicked() {
    document.getElementById("proposal").style.display = "none";
    document.getElementById("celebrate").style.display = "flex";
}
</script>

</body>
</html>
