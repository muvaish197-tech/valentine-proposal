<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Valentine ❤️</title>

<style>
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    height: 100vh;
    font-family: 'Poppins', sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #0f0f0f;
    color: white;
    overflow: hidden;
  }

  .container {
    text-align: center;
    padding: 20px;
    max-width: 90%;
    animation: fadeIn 1.5s ease;
  }

  h1 {
    font-size: 28px;
    font-weight: 600;
    line-height: 1.4;
  }

  h1 span {
    color: #ff4d6d;
  }

  p {
    margin-top: 10px;
    opacity: 0.85;
    font-size: 15px;
  }

  .buttons {
    margin-top: 40px;
    position: relative;
    height: 120px;
  }

  button {
    padding: 14px 34px;
    font-size: 16px;
    border-radius: 40px;
    border: none;
    cursor: pointer;
    transition: 0.3s ease;
  }

  #yes {
    background: #ff4d6d;
    color: white;
    box-shadow: 0 10px 30px rgba(255,77,109,0.4);
  }

  #yes:hover {
    transform: scale(1.05);
  }

  #no {
    position: absolute;
    background: transparent;
    color: #aaa;
    border: 1px solid #444;
  }

  .celebrate {
    text-align: center;
    animation: fadeIn 1.2s ease;
  }

  .celebrate h1 {
    font-size: 30px;
  }

  .heart {
    font-size: 60px;
    margin-top: 20px;
    animation: pulse 1s infinite;
  }

  @keyframes fadeIn {
    from {opacity: 0; transform: translateY(20px);}
    to {opacity: 1; transform: translateY(0);}
  }

  @keyframes pulse {
    0% {transform: scale(1);}
    50% {transform: scale(1.2);}
    100% {transform: scale(1);}
  }
</style>
</head>

<body>

<div class="container" id="main">
  <h1>
    Anuradha <span>❤️</span><br>
    Will you be my Valentine?
  </h1>
  <p>
    Not today.  
    Not just for a moment.  
    But for every smile we share.
  </p>

  <div class="buttons">
    <button id="yes" onclick="yes()">Yes 💖</button>
    <button id="no" onmouseenter="moveNo()">No</button>
  </div>
</div>

<script>
function moveNo() {
  const no = document.getElementById("no");
  const x = Math.random() * 70;
  const y = Math.random() * 70;
  no.style.left = x + "%";
  no.style.top = y + "%";
}

function yes() {
  document.body.innerHTML = `
    <div class="celebrate">
      <h1>She said YES 💖</h1>
      <p>This just became my favourite moment.</p>
      <div class="heart">❤️</div>
    </div>
  `;
}
</script>

</body>
</html>
